name: 功能建议
description: 提议新的能力、行为改进或使用体验优化
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请先说明要解决的实际问题，再描述期望方案，以便评估范围和兼容性。

  - type: textarea
    id: problem
    attributes:
      label: 问题背景
      description: 当前遇到了什么具体问题？这个问题影响了哪些使用场景？
      placeholder: 当我……时，目前只能……，因此……
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: 建议方案
      description: 请描述期望的行为、命令或配置方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 说明尝试过的替代方式，以及它们为什么不能满足需求。

  - type: textarea
    id: examples
    attributes:
      label: 使用示例
      description: 如适用，请提供预期的 CLI 调用、配置片段或交互示例。请勿包含任何敏感信息。
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 可提供相关链接、截图或其他背景信息。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，确认没有内容相同的建议。
          required: true
        - label: 该建议聚焦于一个明确的问题或使用场景。
          required: true
        - label: 我提供的内容不包含 API key、访问令牌或其他敏感信息。
          required: true
