name: 缺陷报告
description: 报告可复现的异常行为或功能故障
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 claude-auto-retry。提交前请移除日志中的 API key、访问令牌、个人信息及其他敏感内容。

  - type: input
    id: version
    attributes:
      label: claude-auto-retry 版本
      description: 请粘贴 `claude-auto-retry --version` 的输出。
      placeholder: 例如：claude-auto-retry 0.1.0
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 其他
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请说明 Python 版本、Claude Code 版本、终端以及安装方式等信息。
      placeholder: |
        Python：3.13.5
        Claude Code：x.y.z
        终端：PowerShell 7
        安装方式：pipx
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供能够稳定复现问题的最小步骤。
      placeholder: |
        1. 执行……
        2. 配置……
        3. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期行为
      description: 你原本期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: 实际行为
      description: 实际发生了什么？优先提供错误类别和退出码，不要粘贴未脱敏的原始 stream。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 如有需要，请粘贴已脱敏的日志或堆栈信息。
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 可提供截图、相关配置或其他有助于定位问题的信息。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，确认没有内容相同的报告。
          required: true
        - label: 我已删除 API key、访问令牌和其他敏感信息。
          required: true
        - label: 我能够按上述步骤复现该问题。
          required: true
