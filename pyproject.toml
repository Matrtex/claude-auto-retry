[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-auto-retry"
version = "0.1.0"
description = "A safety-first retry and same-session resume supervisor for Claude Code CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Matrtex" },
]
keywords = ["claude-code", "retry", "supervisor", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Private :: Do Not Upload",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "ruff>=0.9",
  "twine>=6.0",
]

[project.scripts]
claude-auto-retry = "claude_auto_retry.cli:main"

[project.urls]
Homepage = "https://github.com/Matrtex/claude-auto-retry"
Issues = "https://github.com/Matrtex/claude-auto-retry/issues"
Repository = "https://github.com/Matrtex/claude-auto-retry"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
